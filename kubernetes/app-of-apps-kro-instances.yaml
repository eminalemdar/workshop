apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kro-instances
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/eminalemdar/2048
    targetRevision: HEAD
    path: kubernetes/kro/instances
    directory:
      recurse: true
  destination:
    server: "arn:aws:eks:eu-west-1:247747705325:cluster/workshop"
    namespace: kro
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      # Nothing orders this against kro-rgd; retry until its CRDs exist.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
