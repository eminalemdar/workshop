# The managed Argo CD identifies clusters by EKS ARN — kubernetes.default.svc is
# rejected — and does not register the local cluster for you.
#
# CHANGE ME: the ARN of your own cluster, here and in the two Applications.
# It is arn:aws:eks:<region>:<account-id>:cluster/<cluster-name>.
#
# The namespace for every file in this folder comes from the argocd stack, so
# applying one by hand needs -n argocd.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-local
  labels:
    argocd.argoproj.io/secret-type: cluster
type: Opaque
stringData:
  name: in-cluster
  server: "arn:aws:eks:eu-west-1:247747705325:cluster/workshop"
  project: default
