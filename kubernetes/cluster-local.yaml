# The managed Argo CD identifies clusters by EKS ARN, not API server URL —
# kubernetes.default.svc is rejected. __CLUSTER_ARN__ is filled in from the
# kubernetes stack's output by a before_init hook, so nothing here is
# account-specific.
#
# The namespace for every file in this folder comes from the argocd stack, so
# applying one by hand needs -n argocd.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-local
  labels:
    argocd.argoproj.io/secret-type: cluster
type: Opaque
stringData:
  name: in-cluster
  server: "__CLUSTER_ARN__"
  project: default
